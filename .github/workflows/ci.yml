name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # For building the installer by hand - see the installer job below
  workflow_dispatch:
    inputs:
      server_url:
        description: "Bake this server address into the MSI (e.g. https://monitor.example.com); empty = none"
        required: false
        default: ""

# A new push to the same branch cancels the earlier run, so runners are not held up needlessly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — lint · typecheck · test · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/server

    services:
      # The same Postgres that docker compose provides locally, as a service container.
      # The tests create the `oxeio_test` database themselves (test/setup/global-setup.ts)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxeio
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: oxeio
          TZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxeio -d oxeio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Keep the server TZ on Dhaka: the midnight split and work_date both
      # depend on it (07-Technical-Spec § 2.1a)
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://oxeio:ci-password@localhost:5432/oxeio?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oxeio-monitor/server/package-lock.json

      - name: Install
        run: npm ci

      # Run generate separately so the prisma engine is downloaded even with
      # npm 11's script-approval gate
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Locally `npm test` reads ../.env; in CI the env is set above,
      # so vitest is run directly
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  web:
    name: web — lint · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oxeio-monitor/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` already runs `tsc -b`, so no separate typecheck step is needed
      - name: Build
        run: npm run build

  agent-core:
    name: agent core — build · test (linux)
    # Note: only Core and its tests, not the whole solution.
    # oXeio.Agent targets net8.0-windows10.0.17763.0, which cannot build on Linux.
    # That is the whole point of keeping the rules in Core: they get verified on
    # a cheap runner on every PR.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build rules core
        run: dotnet build src/oXeio.Core/oXeio.Core.csproj -warnaserror

      - name: Test rules core
        run: dotnet test tests/oXeio.Core.Tests/oXeio.Core.Tests.csproj --verbosity normal

  agent-windows:
    name: agent full — build + test (windows)
    # The Win32 layer only builds on a Windows runner.
    #
    # Note: these tests **do not touch the real desktop**; capture, tray and DPAPI
    #    cannot be verified on a headless runner. The ones that do run use a fake
    #    store and a fake server to test the sync loop's decisions - exactly the
    #    place where a mistake would silently delete data.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build -warnaserror

      - name: Test
        run: dotnet test -warnaserror --no-build

  installer:
    name: MSI — only on tags or manual runs
    # Note: not run on every push. The self-contained publish is ~200 MB and
    #    cab compression takes several minutes; in everyday CI that is plain waste.
    #    It is verified before a release (tag) or by running it by hand.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: oxeio-monitor/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # WiX 7 needs its Open Source Maintenance Fee EULA accepted before it
      # builds. This project is used non-commercially, which the OSMF terms
      # exempt from the fee (it applies to revenue-generating use by
      # organisations with US$10,000+ a year). Anyone building it for such
      # use must sponsor the WiX project first: https://docs.firegiant.com/wix/osmf/
      - name: Install WiX
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Build MSI
        shell: pwsh
        # A manual run may bake a server address in (installs on a double-click
        # and can be published as an update); otherwise no address, for
        # `msiexec /i … SERVERURL=https://…`. build.ps1 has no default.
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          if ($env:SERVER_URL) { ./installer/build.ps1 -ServerUrl $env:SERVER_URL }
          else { ./installer/build.ps1 -NoServerUrl }

      - uses: actions/upload-artifact@v4
        with:
          name: oXeioAgent-msi
          path: oxeio-monitor/agent/installer/bin/oXeioAgent-*.msi
          retention-days: 30

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4

      # So a broken Dockerfile is caught now, not on rollout day
      - name: Build API image
        run: docker build -t oxeio-api:ci ./oxeio-monitor/server
