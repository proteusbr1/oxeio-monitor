<!doctype html>
<!--
  `lang="en"`: it used to say `bn`, but EVERY word on screen is English
     ("Switch to light mode", "Reports", "No connection"). Bengali in this repo is in
     code comments and documents, not in the user interface.

  Careful: a wrong `lang` silently breaks three things, and all three show most on phones:
       - screen readers read the English text with BENGALI pronunciation, so the page
         becomes unintelligible to exactly the person who needs it most
       - Chrome asks "Translate this page?": offering to translate an English page
         into English, every time
       - fonts and hyphenation follow the rules of the wrong language
     The same goes for `"lang": "en"` in `manifest.webmanifest`: with two different
     languages in the two places, the installed app and the browser tab would behave
     differently.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oXeio — Workforce Monitor</title>

    <!-- ── Icons ───────────────────────────────────────────────────────
      Careful: the files are in `public/`, so the path starts with `/`: Vite copies
         them as-is into `dist/`, with no hash added.
      SVG first, `.ico` after: modern browsers take the SVG (sharp at any size), and
         older ones, which do not know SVG, fall back to the `.ico`.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!--
      Careful: iOS does not even LOOK at the manifest's icons: the home screen image
         comes only from this tag. Without it the iPhone would take a screenshot of the
         page and make an icon from it, which would be an unrecognizable grey square.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- ── PWA ─────────────────────────────────────────────────────────
      Why `theme_color`/`background_color` have those two values
         (`public/manifest.webmanifest` cannot hold comments, being JSON, so the
         reason is here):

         - `theme_color: #000000` = the DARK value of `--color-chrome`.
           The top bar is `bg-chrome`, and the app's default theme is dark
           (`color-scheme: dark` in `index.css`; the OS preference is deliberately
           not consulted). So the status bar has exactly the colour the installed
           app opens with.
         - `background_color: #0e1116` = the dark value of `--color-paper`.
           This is the splash screen colour, i.e. the few moments before JS starts.
           Careful: leaving the default white would show a flash of white every time
           the app opens, then the dark screen.
         Careful: `light-dark()` does not work in a manifest: only one value can be
            used, so the default theme's is taken.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      TWO `theme-color` tags: both are the two values of `--color-chrome`, because the
         top bar is dark in both themes (#191c22 in light, #000000 in dark).
      Careful: the app's own switch is in `localStorage`, not in the OS preference. So
         the choice of these two and the app's theme will not always match exactly, but
         both values are dark, so the status bar never turns white and clashes with the
         top bar. With a single value there would be a visible line at the edge between
         the browser UI and the page.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#191c22" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!--
      For iOS (Safari still does not fully honour the manifest's `display`/`name`).
      Careful: `status-bar-style` is `black`, NOT `black-translucent`: with translucent
         the page would run UNDER the status bar, and the top bar's text would blend
         into the clock and battery. Fixing it would need `viewport-fit=cover` +
         `env(safe-area-inset-top)`, i.e. a change in `Layout.tsx`, which is outside the
         scope of this work and not needed.
      Careful: without `apple-mobile-web-app-title`, iOS would put the whole `<title>`
         ("oXeio — Workforce Monitor") under the icon and truncate it.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="oXeio" />

    <meta name="description" content="Live workforce monitoring for oXeio LLC — attendance, activity and screenshots." />
  </head>
  <body>
    <!--
      Shown until React renders. main.tsx first asks the server how to show
      dates (zone, currency, format) — usually a blink, up to 3 s on a slow
      link — and an empty page that long reads as "broken".
      Inline style, neutral grey: the stylesheet and the user's theme (kept
      in localStorage) are not known yet, and this has to read on both.
      React replaces it on its first render.
    -->
    <div id="root"><p role="status" style="margin:30vh 0 0;text-align:center;font:13px/1.4 system-ui,sans-serif;color:#8a8f98">Loading oXeio…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
