<!--
  oXeio brand mark: red tile, white X. All the other icons are made from this file.

  Why only the X, not the whole "oX": the mark in Brand.tsx has "oX" (o black, X red),
     but that sits in the top bar at 28px. At 48px in a launcher and 16px in a tab,
     two letters means each is only 5-6px tall; the "o" becomes a smudge and the whole
     thing is unrecognizable. The distinctive letter of oXeio is the X (it is the red
     one in the wordmark), so only that one is kept at small sizes.

  The colours are INVERTED: red tile, white X (in Brand.tsx the tile is white and the X
     red). Among 30 icons on a home screen, colour is the fastest way to recognise one;
     a white tile blends into the wallpaper. Careful: a black tile + white X is
     deliberately excluded, as it is exactly the icon of the X (formerly Twitter) app.

  Careful: the letter's ends are cut PARALLEL (horizontally), not at 90 degrees to the
     stroke. The X of a "close"/error mark is cut perpendicular to the stroke; this one
     difference is what makes the mark read as a LETTER, not a button.

  Careful: the letter is a hand-drawn path, not <text>: with <text> the font would depend
     on the device, and the icon would look different on every phone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="oXeio">
  <!-- The tile is filled right to the corners, no transparency inside -->
  <rect width="512" height="512" rx="112" fill="#ed1c24"/>
  <!-- X: two strokes of equal thickness, in a 308x308 box (60% of the tile).
       The stroke's perpendicular thickness is 66.5 = 13% of the tile, i.e. 2px in a 16px
       favicon; any thinner and the stroke would turn grey and fade away in a tab. -->
  <path fill="#fff" d="M102 102h94L410 410h-94z"/>
  <path fill="#fff" d="M316 102h94L196 410H102z"/>
</svg>
