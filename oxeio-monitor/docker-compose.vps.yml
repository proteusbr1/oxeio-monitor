# Override for the VPS - the base `docker-compose.yml` does not need to be touched.
#
#   Run:
#       docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
#   Careful: **both `-f` flags** are needed every time. If one is forgotten,
#      compose uses the base file alone, so Caddy goes back to `:8080` and 443
#      is closed - and the 15 agents silently keep queuing data.
#      To avoid this, put this in `.env`:
#          COMPOSE_FILE=docker-compose.yml:docker-compose.vps.yml
#      Then a plain `docker compose up -d` picks up both.
#
# Careful: this file **holds no secrets** - everything comes from `.env`.

services:
  web:
    environment:
      # This one value makes Caddy listen on the domain instead of `:8080`,
      # and obtain and renew the certificate from Let's Encrypt by itself.
      #
      # Careful: set `PUBLIC_HOST=monitor.oxeio.com` in `.env`. It is deliberately
      #    not hardcoded here, so a domain change touches only one place.
      CADDY_SITE: ${PUBLIC_HOST:?PUBLIC_HOST is not set — put the domain in .env}
      TZ: Asia/Dhaka

    # Careful: both 80 **and** 443 are needed.
    #
    #    443 is for the real traffic, and 80 is for Let's Encrypt's HTTP-01
    #    validation - with it closed no certificate is issued, and Caddy keeps
    #    retrying and failing in the log. Caddy redirects all other traffic
    #    arriving on 80 to 443 itself, so nothing else is needed.
    #
    # Careful: `!override` is **mandatory**; omitting it fails silently.
    #    By default compose **appends** to a ports list instead of replacing it.
    #    Without `!override` the base `8080:8080` would remain, while in domain
    #    mode Caddy listens on 80/443 - nothing listens on 8080 inside. Result:
    #    a dead port open to the outside on the VPS, and `docker compose ps`
    #    would look fine.
    ports: !override
      - '80:80'
      - '443:443'

    # Careful: **the same trap as above, one level deeper - and it was missed at first.**
    #
    #    The base healthcheck hits `127.0.0.1:8080`, but in domain mode Caddy
    #    does not listen there (see `netstat` above: `:::80` and `:::443`). So the
    #    container was **`unhealthy` from the start, forever** - measured
    #    `FailingStreak: 1077` while the site was serving 200 from outside.
    #
    # Careful: the harm is not "a red label". `docker compose ps` becomes
    #    **useless** as a health signal, and worst of all, a `service_healthy`
    #    condition added to `depends_on` later could never be met.
    #
    # An alarm that is always red teaches people to ignore alarms - that is
    #    the real danger, because next time the red is real nobody will look.
    #
    # Careful: `!override` is **mandatory** - `test` is a list, and compose
    #    **appends** to lists. Without it the command would be
    #    `wget ... :8080/ CMD wget ... :2019/` - meaningless, and still failing silently.
    #
    # Chosen: Caddy's admin API (`127.0.0.1:2019`, enabled by default).
    #    It proves the process is alive **and the config is loaded**, and needs
    #    neither external DNS nor TLS.
    #    Hitting port 80 would not work: in domain mode it answers 301 and
    #    redirects to HTTPS, and the image's **BusyBox** wget has no
    #    `--max-redirect`, so it counts that as a failure (measured: exit 1).
    healthcheck: !override
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 5

    volumes:
      # Careful: **do not remove this.** Caddy keeps certificates and account
      #    keys in `/data`. Without a volume, every container rebuild loses the
      #    certificates and asks Let's Encrypt **again** - and their rate limit
      #    is 5 per week. A few restarts would exceed it and leave the site
      #    without a certificate for a week.
      - caddy-data:/data
      - caddy-config:/config

  api:
    environment:
      # Careful: the dashboard and API share one origin (Caddy), so CORS is not
      #    really needed. It is set anyway - the starting point if another
      #    client is added.
      CORS_ORIGIN: https://${PUBLIC_HOST}

volumes:
  caddy-data:
  caddy-config:
