name: oxeio

services:
  postgres:
    image: postgres:16-alpine
    container_name: oxeio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxeio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oxeio}
      # display only (psql, logs): every timestamp column is timestamptz
      TZ: UTC
    # bound to loopback only — the database is never reachable from the LAN
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxeio} -d ${POSTGRES_DB:-oxeio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Must be the **same** version as the web image - `/health` returns it, and
      # the dashboard compares the two (the only way to catch a half-finished deploy).
      args:
        APP_BUILD: ${APP_BUILD:-}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: oxeio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # the schema is brought up to date before every start
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: ${WORK_TIMEZONE:-UTC}
      # Work-day zone for every date, cron job and report. Usually left empty:
      # the setup wizard (Settings → Company & region later) saves the real one.
      WORK_TIMEZONE: ${WORK_TIMEZONE:-UTC}
      # The first-run setup link is printed in this container's log; with
      # PUBLIC_URL it is a full link. SETUP_TOKEN = choose the token yourself.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Careful: these variables must be passed **explicitly** here. Compose does not
      #    forward the host environment into the container by itself, so without
      #    these lines the server would use its defaults whatever `.env` says - and
      #    there would be no way to tell that "the setting is not working".
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-10}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-2}
      # Per-IP limit. The paired counter did not catch many emails from one IP
      LOGIN_IP_MAX_FAILS: ${LOGIN_IP_MAX_FAILS:-50}
      # ISO 4217, two-decimal currencies only (see .env.example)
      CURRENCY: ${CURRENCY:-BDT}
      PORT: 3000
      STORAGE_ROOT: /data/storage
      # screenshots in an S3-compatible bucket instead of STORAGE_ROOT
      # (deploy/README.md › "Screenshots in an S3-compatible bucket")
      # - empty = local disk, as before
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # Careful: effectively unused when the dashboard runs through the `web`
      #    service - Caddy serves the API and the pages from the **same origin**,
      #    so the browser never makes a cross-origin request (see web/Caddyfile).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # owner's update public key — empty = unsigned updates allowed, as before
      AGENT_UPDATE_PUBLIC_KEY: ${AGENT_UPDATE_PUBLIC_KEY:-}
      # e.g. pt-BR — empty = the dashboard's own date and number formats
      DISPLAY_LOCALE: ${DISPLAY_LOCALE:-}

      # Careful: if unset, a separate key is derived from JWT_SECRET (mixed with
      #    a label), so leaving it empty is safe. If set, screenshot links and
      #    sessions use completely separate keys.
      SCREENSHOT_URL_SECRET: ${SCREENSHOT_URL_SECRET:-}

      # ── Email ───────────────────────────────────────────────────────────
      # Careful: **these six lines used to be missing** - so following the docs
      #    step by step, the server started with email completely off. Alerts were
      #    created and stored in the database but **never reached** anyone - and
      #    nothing showed it as wrong, because "no SMTP" means the channel is
      #    silently disabled.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # If empty, goes to the active owners' email addresses
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

      # ── Nightly backup ──────────────────────────────────────────────────
      # Careful: without BACKUP_PASSPHRASE the backup **will not run** - on purpose.
      #    Having the backup off is safer than leaving a salary and screenshot
      #    database on disk unencrypted. It logs logger.error at boot, plus a
      #    daily alert - it never stays off silently.
      # Careful: not made mandatory with `:?`, because the container
      #    would then not start on dev machines.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # `external` = backed up by another tool; empty = oXeio's own nightly backup
      BACKUP_MODE: ${BACKUP_MODE:-}
      # In this compose Postgres runs in a container and the host may not have
      # pg_dump - so the dump is taken from inside the container.
      BACKUP_DOCKER_CONTAINER: ${BACKUP_DOCKER_CONTAINER:-}
      BACKUP_COPY_TO: ${BACKUP_COPY_TO:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # The other four are passed too - otherwise someone could set them in .env and think it works
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_PG_DUMP: ${BACKUP_PG_DUMP:-}
      BACKUP_DOCKER_BIN: ${BACKUP_DOCKER_BIN:-}
      BACKUP_DOCKER_DB_HOST: ${BACKUP_DOCKER_DB_HOST:-}

      # ── Reports and digest ──────────────────────────────────────────────
      ORG_NAME: ${ORG_NAME:-oXeio Monitoring}
      # If empty, goes to the active owners' email addresses (not to ALERT_EMAIL_TO)
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      # Careful: Teams - free/personal accounts get no webhook
      #    (Workflows only on work/school), so this is usually left empty.
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}

      # ── Telegram alerts (silently off unless both are set) ──────────────
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Careful: the owner's chat, not the staff group - the weekly summary also
      #    goes to this same chat and names who is "falling behind".
      # A personal chat id is a plain positive number; a group/channel id is
      #    negative (`-100...`). Unless it is a positive number the weekly summary
      #    is **not sent at all** (see WEEKLY_DIGEST_ALLOW_GROUP below).
      #    Alerts are not blocked by this - they carry nobody's name.
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # ── Weekly summary on Telegram ──────────────────────────────────────
      # Careful: these two lines must be passed **explicitly** here. Compose does
      #    not forward the host environment into the container by itself, so
      #    without them someone setting WEEKLY_DIGEST_DAY=1 in `.env` would wait
      #    for Monday while the message arrived on Friday - and there would be no
      #    way to tell that "the setting is not working".
      # Day: 1=Mon ... 5=Fri ... 7=Sun. Hour: 0-23 (Dhaka).
      WEEKLY_DIGEST_DAY: ${WEEKLY_DIGEST_DAY:-5}
      WEEKLY_DIGEST_HOUR: ${WEEKLY_DIGEST_HOUR:-18}
      # Careful: the default is empty, i.e. the guard is **on**: if the chat id is
      #    not personal, the weekly summary is not sent, and the log states the
      #    reason and what to do.
      #    Setting `true` lets it go to groups too - a conscious decision, not a
      #    silent accident.
      # Careful: nothing is lost when blocked - the whole message is written to the log.
      WEEKLY_DIGEST_ALLOW_GROUP: ${WEEKLY_DIGEST_ALLOW_GROUP:-}

      # ── HTTPS/TLS ───────────────────────────────────────────────────────
      # Careful: three things are needed **together** to enable it, otherwise
      #    nothing works:
      #    1. the two lines below uncommented  2. ports -> "443:3000"
      #    3. ./deploy/certs:/certs:ro in volumes
      #    and CORS_ORIGIN must start with https://.
      # Setting one without the other makes the server **refuse to start** - if
      #    it silently fell back to HTTP, one typo would send the agents' device
      #    tokens in plaintext over the LAN for months while everything looked
      #    fine from outside.
      # Making the cert: deploy/make-cert.ps1 (details in deploy/README.md ›
      #    "LAN install with a self-signed certificate")
      # TLS_CERT: /certs/oxeio-cert.pem
      # TLS_KEY: /certs/oxeio-key.pem
    # Careful: **do not remove the `127.0.0.1:` part.**
    #
    #    Without it `3000:3000` means the API is **open to the whole world** - on
    #    the VPS that bypasses Caddy (and its TLS) completely, so device tokens
    #    and screenshots would travel over plain HTTP on the internet.
    #    The trap is also silent: the browser would look fine, because the
    #    dashboard goes through Caddy.
    #
    # Caddy reaches the api **through the docker network** (`api:3000`), not
    #    through the published port - so this breaks nothing. The port is kept
    #    only for looking at it directly from the host (curl, debugging).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${STORAGE_HOST_PATH:-./.data/storage}:/data/storage
      # The nightly backup's home.
      #
      # Careful: without this, the default `BACKUP_DIR` (`/data/backups`) lived in
      #    the container's **own layer** - so a backup could be written but was
      #    wiped on every deploy, and on the very day it was needed nothing would
      #    be there. The failure would also be doubly silent: files were being
      #    created, so everyone felt safe.
      - ${BACKUP_HOST_PATH:-./.data/backups}:/data/backups
      # When enabling TLS:
      # - ./deploy/certs:/certs:ro
      # Careful: to use BACKUP_DOCKER_CONTAINER the api container must reach the
      #    host's docker daemon (the socket below must be opened).
      #    This is effectively root-equivalent on the host - open it only when
      #    there is no alternative. There is one: install postgresql-client on
      #    the host and use BACKUP_PG_DUMP, or run the backup from the host.
      # - /var/run/docker.sock:/var/run/docker.sock

    # Careful: the runbook says "both must be healthy", yet there used to be no
    #    healthcheck here - `docker compose ps` showed only "running", and an
    #    app stuck in a crash loop inside is still "running".
    # Careful: the scheme is chosen from TLS_CERT (when the server has TLS, that
    #    port no longer speaks plain HTTP). Verification is skipped because the
    #    cert is self-signed - the call is on loopback, from inside the
    #    container to itself.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Careful: template literals (`${...}`) cannot be used - docker compose
        #    takes them for its own variables and the file becomes invalid.
        - |
          const s = process.env.TLS_CERT ? 'https' : 'http';
          const p = process.env.PORT || 3000;
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
          fetch(s + '://127.0.0.1:' + p + '/api/v1/health')
            .then(r => r.json())
            .then(j => process.exit(j.db === 'up' ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Dashboard ───────────────────────────────────────────────────────────
  # This is the service that was missing until now. Web and API share one origin
  #    (web/Caddyfile), so neither the cookie nor the CORS problem exists any more.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # `deploy/vps-update.sh` fills these from git. If empty, the image's
      #    defaults (`dev`/`local`) apply - the build does not stop, it just stays honest.
      args:
        APP_BUILD: ${APP_BUILD:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    container_name: oxeio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: UTC
      # behind another proxy only — empty = Caddy is the edge, as before
      # (deploy/README.md › "Behind a reverse proxy")
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-}
      CADDY_CLIENT_IP_HEADERS: ${CADDY_CLIENT_IP_HEADERS:-}
    # Careful: `WEB_PORT` is not used in domain mode - there Caddy itself takes 80
    #    and 443 (Let's Encrypt validation happens on 80). docker-compose.vps.yml
    #    replaces these ports and puts PUBLIC_HOST in place of `:8080`.
    #    Details in deploy/README.md › "Domain mode (Caddy is the edge, automatic HTTPS)".
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Brings the schema up to date, then exits; the api waits for it.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  # Optional, for scripted installs that skip the setup wizard:
  #     docker compose --profile seed run --rm seed
  # Creates the owner, the first work policy and holidays from the SEED_*
  # lines in .env (see .env.example). With an owner in place the wizard no
  # longer appears.
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${WORK_TIMEZONE:-UTC}
      # the seed writes it into work_policies.timezone
      WORK_TIMEZONE: ${WORK_TIMEZONE:-UTC}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxeio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oxeio}?schema=public
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_COUNTRY: ${SEED_COUNTRY:-}
      SEED_HOLIDAYS: ${SEED_HOLIDAYS:-}
      SEED_POLICY_MONTHLY_HOURS: ${SEED_POLICY_MONTHLY_HOURS:-}
      SEED_POLICY_WORKDAYS: ${SEED_POLICY_WORKDAYS:-}
      SEED_POLICY_WEEKLY_OFF: ${SEED_POLICY_WEEKLY_OFF:-}
    volumes:
      # Careful: prisma/ is mounted from the host, not baked into the image -
      #    `staff.local.json` may hold staff names and salaries, and in the
      #    image it would spread with every layer copy.
      - ./server/prisma:/app/prisma:ro
    # Careful: not `npm run seed` - it is wrapped in `dotenv -e ../.env`, and
    #    the container has no such file. The variables come from compose.
    command: ["npx", "tsx", "prisma/seed.ts"]

volumes:
  pgdata:
